# Every action in .github/workflows/ is pinned to a commit SHA, with its version in a comment.
# A pin nobody updates goes stale, so Dependabot proposes the bumps: one grouped PR a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
