name: feed-diff

on:
  schedule:
    - cron: "0 11 * * 5" # Fridays 11:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Prove the matcher on planted cases before trusting its report
        run: python3 scripts/feed_diff.py --selftest
      - name: Diff the directory feed and the web sitemap against data/connectors.json
        id: diff
        run: |
          python3 scripts/feed_diff.py --out feed-diff.md --full-out feed-diff-full.md
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Keep the full report as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-diff-${{ steps.diff.outputs.date }}
          path: |
            feed-diff.md
            feed-diff-full.md
          retention-days: 90
      - name: Open the report as an issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Feed diff: ${{ steps.diff.outputs.date }}"
          content-filepath: ./feed-diff.md
          labels: feed-diff
