name: Lint
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx awesome-lint@2.3.0
      - name: awesome-lint entry rules on every category page
        run: bash scripts/lint_category_pages.sh

  generated-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: README.md must match data/connectors.json
        run: python3 scripts/generate_readme.py --check
