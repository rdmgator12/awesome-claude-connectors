name: Lint
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx awesome-lint@2.3.0
      - name: awesome-lint entry rules on every category page
        run: bash scripts/lint_category_pages.sh

  generated-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Prove the validator on planted entries before trusting its check
        run: python3 scripts/generate_readme.py --selftest
      - name: README.md must match data/connectors.json
        run: python3 scripts/generate_readme.py --check
      - name: site-data/ (the website's feed) must match data/connectors.json
        run: python3 scripts/export_site_data.py --check
      - name: Entry ids must keep names in every script whole
        run: python3 scripts/export_site_data.py --selftest
      - name: No listed URL may look like a misspelling of its own name
        run: python3 scripts/name_url_check.py --selftest
